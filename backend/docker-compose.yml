services:
  postgres:
    image: postgres:16
    container_name: ai-space-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_space
    ports:
      - "5435:5432"
    volumes:
      - ai_space_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_space"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ai-space-redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - ai_space_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ai_space_postgres_data:
  ai_space_redis_data: